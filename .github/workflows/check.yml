name: Check changelog PR

on:
  pull_request:
    branches: [main]
    paths:
      - content/changelog.mdx
      - content/images/**
      - app/(home)/changelog/**
      - .github/workflows/check.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
